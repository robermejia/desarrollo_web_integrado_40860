<div class="container mx-auto mt-5">
  <div class="flex justify-between">
    <h1 class="text-2xl my-4">Módulo Productos</h1>
    <button matFab class="!bg-green-600 !hover:bg-bg-green-500 !text-white" matTooltip="Nuevo producto" (click)="nuevoProducto()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="flex justify-between">
    <mat-form-field>
      <input id="nombre-search" matInput placeholder="Buscar" (input)="onSearch($event)">
    </mat-form-field>
    <mat-paginator [length]="resultsLength" [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
  <!-- Tabla -->
  <div class="my-4 relative w-full overflow-x-auto">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)"
      class="custom-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let element">
          {{ element.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="imagen">
        <th mat-header-cell *matHeaderCellDef>Imagen</th>
        <td mat-cell *matCellDef="let element">
          <img [src]="element.imagen" alt="{{ element.nombre }}" class="producto-imagen" />
        </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let element">
          {{ element.nombre }}
        </td>
      </ng-container>

      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
        <td mat-cell *matCellDef="let element">
          {{ element.precio }}
        </td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
        <td mat-cell *matCellDef="let element">
          {{ element.stock }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element" class="w-[60px]">
          <div class="flex gap-3 align-middle">
            <button matMiniFab class="!bg-[#ffcf00] !hover:bg-[#dfb600] !text-black" matTooltip="Editar" (click)="editarProducto(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button matMiniFab class="!bg-red-700 !hover:bg-red-800 !text-white" matTooltip="Eliminar"
              (click)="eliminarProducto(element.id)"><mat-icon>delete</mat-icon></button>
          </div>
        </td>
      </ng-container>

      <tr *matNoDataRow>
        <td [attr.colspan]="columns.length">
          @if (isLoading) {
          <h2>Cargando...</h2>
          } @else if (!isLoading && dataSource.data.length === 0) {
          <h2>No se encontraron datos</h2>
          }
        </td>
      </tr>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let rows; columns: columns"></tr>
    </table>

    <mat-paginator [length]="resultsLength" [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>

</div>
